name: Despliegue Manual a Cloudflare Pages (Método B)

# ============================================================================
# ACTIVACIÓN 100% MANUAL (workflow_dispatch)
# Por instrucción estricta: NO se activa por commits, branches ni pull requests.
# Para ejecutarlo: Ve a GitHub -> pestaña 'Actions' -> selecciona este workflow
# y pulsa el botón 'Run workflow'.
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Compilar y Desplegar en Cloudflare Pages
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Nota: No forzamos cache npm para que no falle si no existe package-lock.json en el repo

      - name: 📦 Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: 🧪 Verificar tipado y compilar Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'proyecta-prod-secret-session-key' }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'https://proyecta.pages.dev' }}

      - name: 🚀 Publicar en Cloudflare Pages vía Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .next --project-name=proyecta-social
