<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Espejo / Máscara de Proyección -->
  <g transform="translate(106, 106)">
    <!-- Marco de espejo -->
    <rect x="30" y="20" width="240" height="260" rx="36" fill="none" stroke="url(#accent)" stroke-width="24" stroke-dasharray="12 6" />
    <!-- Figura interior / Silueta anónima proyectada -->
    <circle cx="150" cy="110" r="46" fill="url(#accent)" opacity="0.9" />
    <path d="M70 240 C70 180, 230 180, 230 240 Z" fill="url(#accent)" opacity="0.85" />
    <!-- Onda expansiva de proyección -->
    <path d="M20 20 L40 40 M280 20 L260 40 M20 280 L40 260 M280 280 L260 260" stroke="#C084FC" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
